<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16a34a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" />
  <circle cx="160" cy="170" r="110" fill="url(#glowGrad)" />

  <!-- Subtle circles -->
  <circle cx="160" cy="150" r="115" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="160" cy="150" r="90" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.3"/>

  <!-- Stylized Head & Shoulders Silhouette -->
  <g filter="url(#shadow)">
    <!-- Shoulders -->
    <path d="M 120 220 C 120 240 70 270 50 310 L 270 310 C 250 270 200 240 200 220 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Face Contour -->
    <path d="M 115 125 C 115 185 135 220 160 220 C 185 220 205 185 205 125 C 205 85 185 70 160 70 C 135 70 115 85 115 125 Z" fill="#334155" opacity="0.9"/>
    
    <!-- Base hair placeholder -->
    <path d="M 115 115 C 112 85 130 65 160 65 C 190 65 208 85 205 115 C 195 95 180 85 160 85 C 140 85 125 95 115 115 Z" fill="#1e293b"/>
    
    <!-- Stylized Facial Hair Geometry -->
    <path d="M 125 155 C 125 210 145 235 160 235 C 175 235 195 210 195 155 C 185 175 170 185 160 185 C 150 185 135 175 125 155 Z" fill="#16a34a"/>
    <!-- Mustache curve -->
    <path d="M 135 165 Q 160 152 185 165 Q 160 172 135 165 Z" fill="#16a34a" opacity="0.95"/>
  </g>

  <!-- Chin / Jaw accent line -->
  <path d="M 140 195 Q 160 215 180 195" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Card Badge & Labels -->
  <rect x="18" y="18" width="54" height="26" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="1.2" opacity="0.95"/>
  <text x="45" y="35" fill="#16a34a" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">B08</text>

  <!-- Title Pill -->
  <rect x="20" y="260" width="280" height="42" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" opacity="0.9"/>
  <text x="160" y="286" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" text-anchor="middle">Van Dyke</text>
</svg>