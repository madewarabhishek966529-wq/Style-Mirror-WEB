<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="320" rx="20" fill="url(#bgGrad)" />
  <circle cx="160" cy="130" r="110" fill="url(#glowGrad)" />

  <!-- Grid / subtle styling rings -->
  <circle cx="160" cy="150" r="115" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="160" cy="150" r="90" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.3"/>

  <!-- Stylized Head & Shoulders Silhouette -->
  <g filter="url(#shadow)">
    <!-- Neck & Shoulders -->
    <path d="M 120 220 C 120 240 70 270 50 310 L 270 310 C 250 270 200 240 200 220 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Face Contour -->
    <path d="M 115 130 C 115 190 135 225 160 225 C 185 225 205 190 205 130 C 205 90 185 75 160 75 C 135 75 115 90 115 130 Z" fill="#334155" opacity="0.9"/>
    
    <!-- Stylized Hair Form based on style -->
    <path d="M 105 130 C 95 90 110 50 160 48 C 210 50 225 90 215 130 C 208 100 185 85 160 85 C 135 85 112 100 105 130 Z" fill="#059669"/>
    <circle cx="160" cy="55" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Hair Cut Details Overlay -->
  <path d="M 125 115 Q 160 100 195 115" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <line x1="160" y1="92" x2="160" y2="108" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Card Badge & Labels -->
  <rect x="18" y="18" width="54" height="26" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" opacity="0.95"/>
  <text x="45" y="35" fill="#059669" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">H21</text>

  <!-- Title Pill -->
  <rect x="20" y="260" width="280" height="42" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" opacity="0.9"/>
  <text x="160" y="286" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" text-anchor="middle">Man Bun</text>
</svg>